{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>{{ _t('Execution Logs') }}</h2>
    <div style="display:flex;align-items:center;gap:0.5rem">
        <label style="font-size:0.85rem;color:var(--text-secondary)">{{ _t('Filter') }}:</label>
        <select id="task-filter" style="width:auto" onchange="window.location='/ui/logs' + (this.value ? '?task_id=' + this.value : '')">
            <option value="">{{ _t('All tasks') }}</option>
            {% for t in tasks %}
            <option value="{{ t.id }}" {% if request.args.get('task_id')|string == t.id|string %}selected{% endif %}>{{ t.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="card">
<div class="table-wrapper">
<table>
    <thead>
        <tr>
            <th>{{ _t('Time') }}</th>
            <th>{{ _t('Task') }}</th>
            <th>{{ _t('Trigger') }}</th>
            <th>{{ _t('Status') }}</th>
            <th>{{ _t('Duration') }}</th>
        </tr>
    </thead>
    <tbody id="log-tbody"
           hx-get="/ui/logs/table?{% if request.args.get('task_id') %}task_id={{ request.args.get('task_id') }}{% endif %}"
           hx-trigger="every 10s"
           hx-swap="innerHTML">
        {% include "_log_table.html" %}
    </tbody>
</table>
</div>
</div>
{% endblock %}
