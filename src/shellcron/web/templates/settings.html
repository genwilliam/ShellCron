{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom:1.5rem">{{ _t('Settings') }}</h2>

<div class="card form-card">
<form method="post" action="/ui/settings/save">
    <div class="form-group">
        <label class="form-label" for="language">{{ _t('Language') }}</label>
        <select id="language" name="language">
            <option value="en" {% if settings.language == 'en' %}selected{% endif %}>{{ _t('English') }}</option>
            <option value="zh" {% if settings.language == 'zh' %}selected{% endif %}>{{ _t('中文') }}</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="log_retention_days">{{ _t('Log Retention (days)') }}</label>
        <input type="number" id="log_retention_days" name="log_retention_days" min="1" max="365"
               value="{{ settings.log_retention_days or 30 }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="default_shell">{{ _t('Default Shell') }}</label>
        <input type="text" id="default_shell" name="default_shell"
               value="{{ settings.default_shell or '' }}" placeholder="/bin/zsh">
    </div>

    <h3 style="margin:1.5rem 0 0.75rem;padding-bottom:0.25rem;border-bottom:1px solid var(--border);font-size:1rem">
        {{ _t('Email Notifications') }}
    </h3>

    <div class="form-group">
        <label class="checkbox-row">
            <input type="checkbox" name="notify_email" {% if settings.notify_email %}checked{% endif %}>
            <span>{{ _t('Enable email notifications') }}</span>
        </label>
    </div>

    <div class="form-group">
        <label class="form-label" for="smtp_server">{{ _t('SMTP Server') }}</label>
        <input type="text" id="smtp_server" name="smtp_server" value="{{ settings.smtp_server or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="smtp_port">{{ _t('SMTP Port') }}</label>
        <input type="number" id="smtp_port" name="smtp_port" value="{{ settings.smtp_port or 465 }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="smtp_username">{{ _t('SMTP Username') }}</label>
        <input type="text" id="smtp_username" name="smtp_username" value="{{ settings.smtp_username or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="smtp_password">{{ _t('SMTP Password') }}</label>
        <input type="password" id="smtp_password" name="smtp_password" value="{{ settings.smtp_password or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label" for="email_recipient">{{ _t('Recipient Email') }}</label>
        <input type="email" id="email_recipient" name="email_recipient" value="{{ settings.email_recipient or '' }}">
    </div>

    <div style="padding-top:0.5rem">
        <button type="submit" class="btn btn-primary">{{ _t('Save Settings') }}</button>
    </div>
</form>
</div>
{% endblock %}
