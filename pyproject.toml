[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shellcron"
version = "0.3.0"
description = "Cron-like task scheduler with CLI, Web UI, and daemon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "apscheduler>=3.10",
    "requests>=2.31",
    "typer>=0.12",
]

[project.scripts]
shcron = "shellcron.cli.main:app"

[tool.setuptools.package-dir]
shellcron = "src/shellcron"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shellcron*"]
